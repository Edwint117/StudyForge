[project]
name = "studyforge-engine"
version = "0.1.0"
description = "StudyForge core engine: pure learning algorithms and provider adapters (wired into FastAPI/pgmq in M0/M4)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "sympy>=1.13",
    "antlr4-python3-runtime==4.11.*",  # SymPy's LaTeX parser (pinned to the version SymPy supports)
    "lark>=1.2",   # fallback LaTeX parser backend (small, pure Python)
    "pint>=0.24",  # unit-aware numeric answer checking
    "tzdata>=2025.2",  # IANA time zones for zoneinfo (Windows + slim containers have none)
    "genanki>=0.13",  # Anki .apkg export (small, pure Python)
    "python-pptx>=1.0",  # PowerPoint parsing (small)
    "python-docx>=1.1",  # Word parsing (small)
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary,pool]>=3.3.6",
    "httpx>=0.28.1",
    "sentry-sdk>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # asserts in tests; math notation (−, ×, ≥) in strings/docstrings is intentional

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sympy.*", "pint.*", "pptx.*", "docx.*", "genanki.*"]
ignore_missing_imports = true
